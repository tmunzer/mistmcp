getSelf:
  type: tool_consolidation
  tags: [self_account]
  description: |-
    This tool can be used to retrieve information about the current user and account
    The information provided will depend on the `action_type` attribute:
    * `account_info`: will return information about the account including account ID, account name, and the list of orgs (and their respective `org_id`) the account has access to, with the permissions level (read or write) for each org
    * `api_usage`: will return information about the API usage of the account including the number of API calls made in the current hour cycle and the API call limit for the account
    * `login_failures`: will return information about the recent login failures for the account including the timestamp of the failure, the source IP address, and the reason for the failure
  read_only_hint: true
  destructive_hint: false
  match_name: action_type
  parameters:
    - name: action_type
      schema:
        type: string
        enum: [account_info, api_usage, login_failures]
      description: Type of information to retrieve about the current user and account. Possible values are `account_info`, `api_usage`, and `login_failures`
      required: true
  requests:
    account_info:
      get:
        operationId: getSelf
        function: mistapi.api.v1.self.self.getSelf(apisession)
    api_usage:
      get:
        operationId: getSelfApiUsage
        function: mistapi.api.v1.self.usage.getSelfApiUsage(apisession)
    login_failures:
      get:
        operationId: getSelfLoginFailures
        function: mistapi.api.v1.self.login_failures.getSelfLoginFailures(apisession)

getSiteRrmInfo:
  type: tool_consolidation
  tags: [sites_rrm]
  description: Retrieve Radio Resource Management (RRM) information for a site. Use current_channel_planning to get the current channel plan, current_rrm_considerations to get RRM considerations for a specific device and band, current_rrm_neighbors to list current RRM neighbor APs for a band, or events to list RRM change events over a time range.
  read_only_hint: true
  destructive_hint: false
  match_name: rrm_info_type
  parameters:
    - name: site_id
      schema:
        type: string
        format: uuid
      description: Site ID
      required: true
    - name: rrm_info_type
      schema:
        type: string
        enum:
          [
            channel_scores,
            current_channel_planning,
            current_rrm_considerations,
            current_rrm_neighbors,
            events,
          ]
      description: "Type of RRM information to retrieve: current_channel_planning returns the current channel plan for the site; current_rrm_considerations returns per-AP RRM considerations (requires device_id and band); current_rrm_neighbors lists current RRM neighbor APs for a band (requires band); events lists RRM change events over a time range"
      required: true
    - name: device_id
      schema:
        type: string
        format: uuid
      description: ID of the AP to retrieve RRM considerations for. Required when rrm_info_type is current_rrm_considerations
      required: false
      required_if:
        rrm_info_type:
          - current_rrm_considerations
    - name: band
      schema:
        type: string
        enum:
          [
            "24",
            "5",
            "5_dedicated",
            "5_selectable",
            "6",
            "6_dedicated",
            "6_selectable",
          ]
      description: 802.11 band. Required when rrm_info_type is current_rrm_considerations or current_rrm_neighbors
      required: false
      required_if:
        rrm_info_type:
          - current_rrm_considerations
          - current_rrm_neighbors
          - channel_scores
    - name: start
      schema:
        type: integer
      description: Start time (epoch timestamp in seconds)
      required: false
    - name: end
      schema:
        type: integer
      description: End time (epoch timestamp in seconds)
      required: false
    - name: duration
      schema:
        type: string
      description: Time range duration (e.g. 1d, 1h, 10m). Only applicable when rrm_info_type is events
      required: false
      only_if:
        rrm_info_type:
          - events
    - name: limit
      schema:
        type: integer
        default: 200
      description: Max number of results per page. Only applicable when rrm_info_type is events
      required: false
      only_if:
        rrm_info_type:
          - events
    - name: page
      schema:
        type: integer
        default: 1
      description: Page number for pagination. Only applicable when rrm_info_type is events
      required: false
      only_if:
        rrm_info_type:
          - events
  requests:
    channel_scores:
      get:
        operationId: getSiteChannelScores
        function: mistapi.api.v1.sites.rrm.getSiteChannelScores(apisession, site_id=str(site_id), band=str(band.value), start=str(start) if start else None, end=str(end) if end else None)
    current_channel_planning:
      get:
        operationId: getSiteCurrentChannelPlanning
        function: mistapi.api.v1.sites.rrm.getSiteCurrentChannelPlanning(apisession, site_id=str(site_id))
    current_rrm_considerations:
      get:
        operationId: getSiteCurrentRrmConsiderations
        function: mistapi.api.v1.sites.rrm.getSiteCurrentRrmConsiderations(apisession, site_id=str(site_id), device_id=str(device_id), band=str(band.value))
    current_rrm_neighbors:
      get:
        operationId: listSiteCurrentRrmNeighbors
        function: mistapi.api.v1.sites.rrm.listSiteCurrentRrmNeighbors(apisession, site_id=str(site_id), band=str(band.value))
    events:
      list:
        operationId: listSiteRrmEvents
        function: mistapi.api.v1.sites.rrm.listSiteRrmEvents(apisession, site_id=str(site_id), band=band.value if band else None, start=str(start) if start else None, end=str(end) if end else None, duration=duration if duration else None, limit=limit, page=page)

getOrgLicenses:
  type: tool_consolidation
  tags: [orgs]
  description: |-
    This tool can be used to retrieve information about the licenses of an org
  read_only_hint: true
  destructive_hint: false
  parameters:
    - name: org_id
      schema:
        type: string
        format: uuid
      description: ID of the organization to retrieve license information for
      required: true
    - name: response_type
      schema:
        type: string
      description: Type of license information to retrieve. `claim_status` returns the status of an asynchronous license claim operation, `by_site` returns the list of licenses for each site in the org, and `summary` returns a summary of the licenses in the org including total count and count by license type
      required: true
  match_name: response_type
  requests:
    claim_status:
      get:
        operationId: GetOrgLicenseAsyncClaimStatus
        function: mistapi.api.v1.orgs.claim.GetOrgLicenseAsyncClaimStatus(apisession, org_id=str(org_id))
    by_site:
      get:
        operationId: getOrgLicensesBySite
        function: mistapi.api.v1.orgs.licenses.getOrgLicensesBySite(apisession, org_id=str(org_id))
    summary:
      get:
        operationId: getOrgLicensesSummary
        function: mistapi.api.v1.orgs.licenses.getOrgLicensesSummary(apisession, org_id=str(org_id))

getStats:
  type: tool_consolidation
  tags: [stats]
  description: Use this tool to retrieve various statistics from Mist infrastructure including organization and site-level data. Supports stats for MxEdges, devices, BGP, OSPF, peer paths, ports, and wireless clients. Use object_id to filter results by device ID or MAC address (format varies by stats_type).
  read_only_hint: true
  destructive_hint: false
  match_name: stats_type
  parameters:
    - name: stats_type
      schema:
        type: string
        enum:
          [
            org,
            sites,
            org_mxedges,
            org_wireless_clients,
            org_devices,
            org_bgp,
            org_ospf,
            org_peer_paths,
            org_ports,
            site_mxedges,
            site_wireless_clients,
            site_devices,
            site_bgp,
            site_ospf,
            site_ports,
          ]
      description: "Type of statistics to retrieve: org, sites, org_mxedges, org_wireless_clients, org_devices, org_bgp, org_ospf, org_peer_paths, org_ports, site_mxedges, site_wireless_clients, site_devices, site_bgp, site_ospf, or site_ports"
      required: true
    - name: org_id
      schema:
        type: string
        format: uuid
      description: Organization ID (required for all queries)
      required: true
    - name: site_id
      schema:
        type: string
        format: uuid
      description: "Site ID (required for site-level stats: site_mxedges, site_wireless_clients, site_devices, site_bgp, site_ospf, site_ports)"
      required: false
      required_if:
        stats_type:
          - site_mxedges
          - site_wireless_clients
          - site_devices
          - site_bgp
          - site_ospf
          - site_ports
    - name: device_type
      schema:
        type: string
        enum: [ap, switch, gateway]
      description: "Device type filter (ap, switch, gateway). Only applicable when stats_type is org_devices or site_devices"
      required: false
      only_if:
        stats_type:
          - org_devices
          - site_devices
    - name: object_id
      schema:
        type: string
      description: "Filter by specific object ID or MAC address (format depends on stats_type): Mist Edge ID for mxedges, device ID for devices, MAC address for BGP/OSPF/peer_paths/ports, client MAC for wireless_clients, site ID for sites"
      required: false
    - name: start
      schema:
        type: integer
      description: Start time (epoch timestamp in seconds)
      required: false
    - name: end
      schema:
        type: integer
      description: End time (epoch timestamp in seconds)
      required: false
    - name: limit
      schema:
        type: integer
        default: 20
      description: Max number of results to return (max 1000)
      required: false
  requests:
    org:
      get:
        operationId: getOrgStats
        function: mistapi.api.v1.orgs.stats.getOrgStats(apisession, org_id=str(org_id))
    sites:
      list:
        operationId: listOrgSiteStats
        function: mistapi.api.v1.orgs.stats.listOrgSiteStats(apisession, org_id=str(org_id), limit=limit)
      get:
        operationId: getSiteStats
        function: mistapi.api.v1.sites.stats.getSiteStats(apisession, site_id=str(object_id))
    org_mxedges:
      list:
        operationId: listOrgMxEdgesStats
        function: mistapi.api.v1.orgs.stats.listOrgMxEdgesStats(apisession, org_id=str(org_id), start=str(start) if start else None, end=str(end) if end else None, limit=limit)
      get:
        operationId: getOrgMxEdgeStats
        function: mistapi.api.v1.orgs.stats.getOrgMxEdgeStats(apisession, org_id=str(org_id), mxedge_id=str(object_id))
    org_devices:
      list:
        operationId: listOrgDevicesStats
        function: mistapi.api.v1.orgs.stats.listOrgDevicesStats(apisession, org_id=str(org_id), type=device_type.value if device_type else None, start=str(start) if start else None, end=str(end) if end else None, mac=str(object_id), limit=limit)
    org_bgp:
      list:
        operationId: searchOrgBgpStats
        function: mistapi.api.v1.orgs.stats.searchOrgBgpStats(apisession, org_id=str(org_id), start=str(start) if start else None, end=str(end) if end else None, mac=str(object_id) if object_id else None, limit=limit)
    org_ospf:
      list:
        operationId: searchOrgOspfStats
        function: mistapi.api.v1.orgs.stats.searchOrgOspfStats(apisession, org_id=str(org_id), start=str(start) if start else None, end=str(end) if end else None, mac=str(object_id) if object_id else None )
    org_peer_paths:
      list:
        operationId: searchOrgPeerPathStats
        function: mistapi.api.v1.orgs.stats.searchOrgPeerPathStats(apisession, org_id=str(org_id), start=str(start) if start else None, end=str(end) if end else None, mac=str(object_id) if object_id else None, limit=limit)
    org_ports:
      list:
        operationId: searchOrgSwOrGwPorts
        function: mistapi.api.v1.orgs.stats.searchOrgSwOrGwPorts(apisession, org_id=str(org_id), mac=str(object_id) if object_id else None, limit=limit)
    site_mxedges:
      list:
        operationId: listSiteMxEdgesStats
        function: mistapi.api.v1.sites.stats.listSiteMxEdgesStats(apisession, site_id=str(site_id), start=str(start) if start else None, end=str(end) if end else None, limit=limit)
      get:
        operationId: getSiteMxEdgeStats
        function: mistapi.api.v1.sites.stats.getSiteMxEdgeStats(apisession, site_id=str(site_id), start=str(start) if start else None, end=str(end) if end else None, mxedge_id=str(object_id))
    site_wireless_clients:
      list:
        operationId: listSiteWirelessClientsStats
        function: mistapi.api.v1.sites.stats.listSiteWirelessClientsStats(apisession, site_id=str(site_id), start=str(start) if start else None, end=str(end) if end else None, limit=limit)
      get:
        operationId: getSiteWirelessClientStats
        function: mistapi.api.v1.sites.stats.getSiteWirelessClientStats(apisession, site_id=str(site_id),  client_mac=str(object_id))
    site_devices:
      list:
        operationId: listSiteDevicesStats
        function: mistapi.api.v1.sites.stats.listSiteDevicesStats(apisession, site_id=str(site_id), type=device_type.value if device_type else None, limit=limit)
      get:
        operationId: getSiteDeviceStats
        function: mistapi.api.v1.sites.stats.getSiteDeviceStats(apisession, site_id=str(site_id), device_id=str(object_id))
    site_bgp:
      list:
        operationId: searchSiteBgpStats
        function: mistapi.api.v1.sites.stats.searchSiteBgpStats(apisession, site_id=str(site_id), start=str(start) if start else None, end=str(end) if end else None, mac=str(object_id) if object_id else None, limit=limit)
    site_ospf:
      list:
        operationId: searchSiteOspfStats
        function: mistapi.api.v1.sites.stats.searchSiteOspfStats(apisession, site_id=str(site_id), start=str(start) if start else None, end=str(end) if end else None, mac=str(object_id) if object_id else None, limit=limit)
    site_ports:
      list:
        operationId: searchSiteSwOrGwPorts
        function: mistapi.api.v1.sites.stats.searchSiteSwOrGwPorts(apisession, site_id=str(site_id), mac=str(object_id) if object_id else None, limit=limit)

searchAuditLogs:
  type: tool_consolidation
  tags: [events]
  description: |-
    Search audit logs for the current account or an organization
  read_only_hint: true
  destructive_hint: false
  match_name: scope
  parameters:
    - name: scope
      schema:
        type: string
        enum: [self, org]
      description: Whether to retrieve audit logs for the account or a specific organization. If `org` is selected, the `org_id` parameter is required
      required: true
    - name: org_id
      schema:
        type: string
        format: uuid
      description: ID of the organization to retrieve audit logs for
      required: false
      required_if:
        scope:
          - org
    - name: start
      schema:
        type: integer
      description: Start time (epoch timestamp in seconds)
      required: false
    - name: end
      schema:
        type: integer
      description: End time (epoch timestamp in seconds)
      required: false
    - name: message
      schema:
        type: string
      description: Message to filter audit logs by (partial search)
      required: false
    - name: limit
      schema:
        type: integer
        default: 20
      description: Max number of results to return (max 1000)
      required: false
  requests:
    self:
      list:
        operationId: listSelfAuditLogs
        function: mistapi.api.v1.self.logs.listSelfAuditLogs(apisession, start=str(start) if start else None, end=str(end) if end else None, message=str(message) if message else None, limit=limit )
    org:
      list:
        operationId: listOrgAuditLogs
        function: mistapi.api.v1.orgs.logs.listOrgAuditLogs(apisession, org_id=str(org_id), start=str(start) if start else None, end=str(end) if end else None, message=str(message) if message else None, limit=limit )

listRogueDevices:
  type: tool_consolidation
  tags: [sites_rogues]
  description: |-
    Retrieve a list of rogue devices (APs or clients) for a site, with optional filters for rogue AP type and time range
  read_only_hint: true
  destructive_hint: false
  match_name: rogue_type
  parameters:
    - name: site_id
      schema:
        type: string
        format: uuid
      description: ID of the site to retrieve rogue devices for
      required: true
    - name: rogue_type
      schema:
        type: string
        enum: [ap, client]
      description: Type of rogue device to filter by
      required: true
    # - name: rogue_bssid
    #   schema:
    #     type: string
    #   description: BSSID of the rogue device to filter by. Only applicable when filtering for rogue APs
    #   required: false
    - name: rogue_ap_type
      schema:
        type: string
        enum: [honeypot, lan, others, spoof]
      description: Type of rogue AP to filter by. Only applicable when filtering for rogue APs
      required: false
      only_if:
        rogue_type:
          - ap
    - name: start
      schema:
        type: integer
      description: Start time (epoch timestamp in seconds)
      required: false
    - name: end
      schema:
        type: integer
      description: End time (epoch timestamp in seconds)
      required: false
    - name: limit
      schema:
        type: integer
        default: 20
      description: Max number of results to return (max 1000)
      required: false
  requests:
    ap:
      list:
        operationId: listSiteRogueAPs
        function: mistapi.api.v1.sites.insights.listSiteRogueAPs(apisession, site_id=str(site_id), type=rogue_ap_type.value if rogue_ap_type else None, limit=limit, start=str(start) if start else None, end=str(end) if end else None )
      # get:
      #   operationId: getSiteRogueAP
      #   function: mistapi.api.v1.sites.rogues.getSiteRogueAP(apisession, site_id=str(site_id), rogue_bssid=rogue_bssid)
    client:
      list:
        operationId: listSiteRogueClients
        function: mistapi.api.v1.sites.insights.listSiteRogueClients(apisession, site_id=str(site_id), limit=limit, start=str(start) if start else None, end=str(end) if end else None )

searchDeviceConfigHistory:
  type: tool_consolidation
  tags: [configuration]
  description: |-
    Search for entries in device config history. 
    This tool can be used to track configuration changes over time, useful for troubleshooting issues that started after a config change.
  read_only_hint: true
  destructive_hint: false
  match_name: query_type
  parameters:
    - name: site_id
      schema:
        type: string
        format: uuid
      description: Site ID of the device to search config history for
      required: true
    - name: query_type
      schema:
        type: string
        enum: [history, last_configs]
      description: Whether to search for config history entries or just retrieve the last config entry for each device
      required: true
    - name: device_type
      schema:
        type: string
        enum: [ap, switch, gateway]
      description: Type of device to search config history for
      required: true
    - name: device_mac
      schema:
        type: string
      description: MAC address of the device to search config history for
      required: false
    - name: start
      schema:
        type: integer
      description: Start time (epoch timestamp in seconds)
      required: false
    - name: end
      schema:
        type: integer
      description: End time (epoch timestamp in seconds)
      required: false
    - name: limit
      schema:
        type: integer
        default: 20
      description: Max number of results to return (max 1000)
      required: false
  requests:
    history:
      list:
        operationId: searchSiteDeviceConfigHistory
        function: mistapi.api.v1.sites.devices.searchSiteDeviceConfigHistory(apisession, site_id=str(site_id), type=device_type.value if device_type else None, mac=str(device_mac) if device_mac else None, start=str(start) if start else None, end=str(end) if end else None, limit=limit )
    last_configs:
      list:
        operationId: searchSiteDeviceLastConfigs
        function: mistapi.api.v1.sites.devices.searchSiteDeviceLastConfigs(apisession, site_id=str(site_id), device_type=device_type.value if device_type else None, mac=str(device_mac) if device_mac else None, start=str(start) if start else None, end=str(end) if end else None, limit=limit)

searchNacUserMacs:
  type: tool_consolidation
  tags: [orgs_nac]
  description: |-
    Search for NAC user MAC addresses in an organization or site, with optional filters for associated SSID and time range. User MACs are used to perform MAC Authentication with Juniper Mist NAC.
  read_only_hint: true
  destructive_hint: false
  if_filter: usermac_id
  parameters:
    - name: org_id
      schema:
        type: string
        format: uuid
      description: Organization ID to search for NAC endpoints in
      required: true
    - name: usermac_id
      schema:
        type: string
      description: ID of the User MAC address to return details for. If specified, other filters are ignored and details for the specified User MAC address is returned if it exists
      required: false
    - name: mac
      schema:
        type: string
      description: Partial / full Client MAC Address. Use `prefix*` for prefix search or `*substring*` for contains search (e.g. `aabbcc*` and `*bbcc*` match `aabbccddeeff`). Suffix-only wildcards (e.g. `*bccddeeff`) are not supported
      required: false
    - name: labels
      schema:
        type: array
        items:
          type: string
      description: Comma separated list of labels to filter NAC endpoints by. A NAC endpoint must have all the specified labels to be included in the results
      required: false
    - name: limit
      schema:
        type: integer
        default: 20
      description: Max number of results to return (max 1000)
      required: false
  requests:
    default:
      list:
        operationId: searchOrgUserMacs
        function: mistapi.api.v1.orgs.usermacs.searchOrgUserMacs(apisession, org_id=str(org_id), mac=str(mac) if mac else None, labels=labels if labels else None, limit=limit )
      get:
        operationId: getOrgUserMac
        function: mistapi.api.v1.orgs.usermacs.getOrgUserMac(apisession, org_id=str(org_id), usermac_id=str(usermac_id) )

troubleshoot:
  type: tool_consolidation
  tags: [marvis]
  description: |-
    Troubleshoot sites, devices, clients, and wired clients for a maximum of the last 7 days. Use `mist_search_assets` with the appropriate `asset_type` to resolve client or device MAC addresses first. Requires a Marvis subscription license.
  read_only_hint: true
  destructive_hint: false
  parameters:
    - name: org_id
      schema:
        type: string
        format: uuid
      description: ID of the organization to run the troubleshooting query for
      required: true
    - name: troubleshoot_type
      schema:
        type: string
        enum: [wan, wired, wireless]
      description: Type of troubleshooting query to run. Possible values are `wan`, `wired`, and `wireless`. If `wan` is selected, the query will troubleshoot the WAN. If `wired` is selected, the query will troubleshoot the wired network. If `wireless` is selected, the query will troubleshoot the wireless network.
      required: true
    - name: site_id
      schema:
        type: string
        format: uuid
      description: Used to troubleshoot a whole site. ID of the site to run the troubleshooting query for
      required: false
    - name: mac
      schema:
        type: string
      description: Used to troubleshoot a specific client or device. MAC address of the client or device to run the troubleshooting query for. Not required if troubleshooting a whole site with `site_id`
      required: false
    - name: start
      schema:
        type: integer
      description: Start time (epoch timestamp in seconds)
      required: false
    - name: end
      schema:
        type: integer
      description: End time (epoch timestamp in seconds)
      required: false
  requests:
    default:
      get:
        operationId: troubleshootOrg
        function: mistapi.api.v1.orgs.troubleshoot.troubleshootOrg(apisession, org_id=str(org_id), site_id=str(site_id) if site_id else None, type=troubleshoot_type.value, mac=str(mac) if mac else None, start=str(start) if start else None, end=str(end) if end else None )
