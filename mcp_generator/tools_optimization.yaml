listSiteWirelessClientsStats:
  type: tool_optimization
  add_parameters:
    - name: client_mac
      schema:
        type: string
      description: MAC address of the client to filter stats by
  custom_request: mistapi.api.v1.sites.stats.getSiteWirelessClientStats(apisession, site_id=str(site_id), client_mac=client_mac)
getSiteWirelessClientStats:
  skip: true

listSiteRogueAPs:
  type: tool_optimization
  add_parameters:
    - name: rogue_bssid
      schema:
        type: string
      description: BSSID of the rogue AP to filter stats by
  custom_request: mistapi.api.v1.sites.rogues.getSiteRogueAP(apisession, site_id=str(site_id), rogue_bssid=rogue_bssid)
getSiteRogueAP:
  skip: true

getInsightMetrics:
  type: tool_consolidation
  tags: [sites_insights]
  description: Get insight metrics for a given object
  read_only_hint: true
  destructive_hint: false
  parameters:
    - name: site_id
      schema:
        type: string
        format: uuid
      description: ID of the Mist Site
      required: true
    - name: object_type
      schema:
        type: string
      description: Type of object to retrieve metrics for
      required: true
    - name: metric
      schema:
        type: string
      description: Name of the metric to retrieve. Use the tool`mist_get_constants` with `object_type=insight_metrics` to see available metrics
      required: true
    - name: mac
      schema:
        type: string
      description: MAC address of the client or device to retrieve metrics for. Required if object_type is 'client', 'ap', 'mxedge' or 'switch'
      required: false
    - name: device_id
      schema:
        type: string
        format: uuid
      description: ID of the gateway device to retrieve metrics for. Required if object_type is 'gateway'
      required: false
    - name: start
      schema:
        type: integer
      description: Start time (epoch timestamp in seconds)
      required: false
    - name: end
      schema:
        type: integer
      description: End time (epoch timestamp in seconds)
      required: false
    - name: duration
      schema:
        type: string
      description: Duration like 7d, 2w
      required: false
    - name: interval
      schema:
        type: string
      description: Aggregation works by giving a time range plus interval (e.g. 1d, 1h, 10m) where aggregation function would be applied to
      required: false
    - name: page
      schema:
        type: integer
      description: Page number
      required: false
    - name: limit
      schema:
        type: integer
        default: 20
      description: Max number of results to return (max 1000)
      required: false
  requests:
    site:
      get:
        operationId: getSiteInsightMetrics
        function: mistapi.api.v1.sites.insights.getSiteInsightMetrics(apisession, site_id=str(site_id), metrics=str(metric), start=str(start) if start else None, end=str(end) if end else None, duration=str(duration) if duration else None, interval=str(interval) if interval else None, limit=limit, page=page)

    client:
      get:
        operationId: getSiteInsightMetrics
        function: mistapi.api.v1.sites.insights.getSiteInsightMetricsForClient(apisession, site_id=str(site_id), client_mac=str(mac), metrics=str(metric), start=str(start) if start else None, end=str(end) if end else None, duration=str(duration) if duration else None, interval=str(interval) if interval else None, limit=limit, page=page)

    ap:
      get:
        operationId: getSiteInsightMetrics
        function: mistapi.api.v1.sites.insights.getSiteInsightMetricsForDevice(apisession, site_id=str(site_id), device_mac=str(mac), metric=str(metric), start=str(start) if start else None, end=str(end) if end else None, duration=str(duration) if duration else None, interval=str(interval) if interval else None, limit=limit, page=page)

    gateway:
      get:
        operationId: getSiteInsightMetrics
        function: mistapi.api.v1.sites.insights.getSiteInsightMetricsForGateway(apisession, site_id=str(site_id), device_id=str(device_id), metrics=str(metric), start=str(start) if start else None, end=str(end) if end else None, duration=str(duration) if duration else None, interval=str(interval) if interval else None, limit=limit, page=page)

    mxedge:
      get:
        operationId: getSiteInsightMetrics
        function: mistapi.api.v1.sites.insights.getSiteInsightMetricsForMxEdge(apisession, site_id=str(site_id), device_mac=str(mac), metric=str(metric), start=str(start) if start else None, end=str(end) if end else None, duration=str(duration) if duration else None, interval=str(interval) if interval else None, limit=limit, page=page)

    switch:
      get:
        operationId: getSiteInsightMetrics
        function: mistapi.api.v1.sites.insights.getSiteInsightMetricsForSwitch(apisession, site_id=str(site_id), device_mac=str(mac), metric=str(metric), start=str(start) if start else None, end=str(end) if end else None, duration=str(duration) if duration else None, interval=str(interval) if interval else None, limit=limit, page=page)

